name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Native Windows (MinGW-w64)
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-clang-tools-extra
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sqlite/sqlite
          ref: cb547ab3e931c7766e24834af5ef6c4578863e3d
          path: sqlite-source
      - name: Record native toolchain and pinned source
        run: |
          gcc --version
          g++ --version
          cmake --version
          python3 --version
          test "$(git -C sqlite-source rev-parse HEAD)" = \
            cb547ab3e931c7766e24834af5ef6c4578863e3d
          test "$(cat sqlite-source/VERSION)" = "3.54.0"
          test "$(cat sqlite-source/manifest.uuid)" = \
            "65ec11f05a9ee5b23495427ece76c0550a8ffc28980a8a0c72d556ba0d2290e2"
      - name: Generate the pinned native oracle inputs
        run: |
          mkdir sqlite-build
          cd sqlite-build
          ../sqlite-source/configure
          make sqlite3.c -j2
          printf '%s  %s\n' \
            '4cee66a6b5eecaf9a016fd62bdc64be75a1f5ab1c34c5881a539fdca639fada6' \
            'sqlite3.c' | sha256sum -c -
          printf '%s  %s\n' \
            'ab12aaa090d3921ba8fd2c8c198ae1e8cafce79fd9897a5b89830fab1f6ecef5' \
            'sqlite3.h' | sha256sum -c -
      - name: Configure native Windows
        run: |
          cmake --preset windows-debug \
            -DPython3_EXECUTABLE="$(cygpath -m "$(command -v python3)")" \
            -DMODERN_SQLITE_PINNED_SQLITE_C="$PWD/sqlite-build/sqlite3.c" \
            -DMODERN_SQLITE_PINNED_SQLITE_H="$PWD/sqlite-build/sqlite3.h"
      - name: Build native Windows
        run: cmake --build --preset windows-debug --parallel 2
      - name: Run the complete declared native correctness tier
        run: ctest --preset windows-debug
      - name: Run native verification and workflow tooling
        run: >-
          ctest --test-dir build/windows-debug --output-on-failure --no-tests=error
          -R '^tools\.(verification|ci_workflow_policy)$'
      - name: Check the native Windows backend with clang-tidy
        run: |
          clang-tidy --version
          cmake -S . -B build/windows-quality -G Ninja \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMODERN_SQLITE_BUILD_TESTS=OFF \
            -DMODERN_SQLITE_ENABLE_CLANG_TIDY=ON
          cmake --build build/windows-quality --parallel 2 --target \
            CMakeFiles/modern_sqlite.dir/src/platform/windows_vfs.cpp.obj

  build-and-test:
    name: build-and-test (${{ matrix.os }}, ${{ matrix.preset }})
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: dev-debug
            run_on_pr: false
          - os: ubuntu-latest
            preset: release
            run_on_pr: true
          - os: macos-latest
            preset: dev-debug
            run_on_pr: true
          - os: macos-latest
            preset: release
            run_on_pr: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || matrix.run_on_pr
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: github.event_name == 'push' || matrix.run_on_pr
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.preset }}-
      - name: Install Ninja on Linux
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ccache ninja-build
      - name: Install Ninja on macOS
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Configure
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          cmake --preset "${{ matrix.preset }}"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        if: github.event_name == 'push' || matrix.run_on_pr
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 3
      - name: Test
        if: github.event_name == 'push' || matrix.run_on_pr
        run: ctest --preset "${{ matrix.preset }}" --parallel 2
      - name: Report compiler cache
        if: github.event_name == 'push' || matrix.run_on_pr
        run: ccache --show-stats

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-asan-ubsan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: ccache-${{ runner.os }}-asan-ubsan-
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install --yes ccache ninja-build
      - name: Configure
        run: cmake --preset asan-ubsan -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset asan-ubsan --parallel 3
      - name: Test
        run: ctest --preset asan-ubsan
      - name: Report compiler cache
        run: ccache --show-stats

  quality:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install quality tools
        run: |
          brew install llvm ninja
          python3 -m venv .quality-tools
          .quality-tools/bin/pip install clang-format==23.1.2
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$PWD/.quality-tools/bin" >> "$GITHUB_PATH"
      - name: Check engineering discipline
        run: python3 tools/check_engineering_discipline.py
      - name: Configure quality build
        run: |
          cmake --preset clang-tidy \
            -DMODERN_SQLITE_CLANG_FORMAT_EXECUTABLE="$PWD/.quality-tools/bin/clang-format" \
            -DMODERN_SQLITE_CLANG_TIDY_EXECUTABLE="$(brew --prefix llvm)/bin/clang-tidy"
      - name: Check changed translation units
        if: github.event_name == 'pull_request'
        run: >
          python3 tools/run_changed_clang_tidy.py
          --base-ref "origin/${{ github.base_ref }}"
          --build-directory build/clang-tidy
          --jobs 3
          --smoke-source src/base/bytes.cpp
      - name: Check formatting
        run: cmake --build --preset clang-tidy --target check-format

  read-performance-contract:
    name: read-performance-contract (${{ matrix.os }})
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run_on_pr: true
          - os: macos-latest
            run_on_pr: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || matrix.run_on_pr
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: github.event_name == 'push' || matrix.run_on_pr
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: ccache-${{ runner.os }}-release-
      - name: Validate committed read baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          python3 tools/read_performance.py validate-historical-baseline \
            --repository-root . \
            --workloads tests/performance/read-workloads-v1.json \
            --baseline benchmarks/read-baseline-v1
      - name: Validate committed index workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/index_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/index-workloads-v1.json
      - name: Validate committed index baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          if test -d benchmarks/index-baseline-v1; then
            python3 tools/index_performance.py validate-historical-baseline \
              --repository-root . \
              --workloads tests/performance/index-workloads-v1.json \
              --baseline benchmarks/index-baseline-v1
          fi
      - name: Validate committed ORDER BY workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/order_by_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/order-by-workloads-v1.json
      - name: Validate committed ORDER BY baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          python3 tools/order_by_performance.py validate-historical-baseline \
            --repository-root . \
            --workloads tests/performance/order-by-workloads-v1.json \
            --baseline benchmarks/order-by-baseline-v1
      - name: Validate committed DISTINCT and compound workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/distinct_compound_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/distinct-compound-workloads-v1.json
      - name: Validate committed DISTINCT and compound baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/distinct_compound_performance.py validate-historical-baseline
          --repository-root .
          --workloads tests/performance/distinct-compound-workloads-v1.json
          --baseline benchmarks/distinct-compound-baseline-v1
      - name: Validate committed aggregate workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/aggregate_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/aggregate-workloads-v1.json
      - name: Validate committed aggregate baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/aggregate_performance.py validate-historical-baseline
          --repository-root .
          --workloads tests/performance/aggregate-workloads-v1.json
          --baseline benchmarks/aggregate-baseline-v1
      - name: Validate committed write workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          python3 tools/write_performance.py validate-workloads \
            --workloads tests/performance/write-workloads-v1.json
          python3 tools/write_performance_v2.py validate-workloads \
            --workloads tests/performance/write-workloads-v2.json
      - name: Validate committed write baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          if test -d benchmarks/write-baseline-v1; then
            python3 tools/write_performance_v2.py validate-historical-baseline \
              --repository-root . \
              --workloads tests/performance/write-workloads-v1.json \
              --baseline benchmarks/write-baseline-v1
          fi
          if test -d benchmarks/write-baseline-v2; then
            python3 tools/write_performance_v2.py validate-baseline \
              --repository-root . \
              --workloads tests/performance/write-workloads-v2.json \
              --baseline benchmarks/write-baseline-v2
          fi
      - name: Check out pinned SQLite
        if: github.event_name == 'push' || matrix.run_on_pr
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sqlite/sqlite
          ref: cb547ab3e931c7766e24834af5ef6c4578863e3d
          path: sqlite-source
      - name: Install benchmark tools on Linux
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ccache ninja-build tcl
      - name: Install benchmark tools on macOS
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Verify pinned SQLite checkout
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          test "$(cat sqlite-source/VERSION)" = "3.54.0"
          test "$(cat sqlite-source/manifest.uuid)" = \
            "65ec11f05a9ee5b23495427ece76c0550a8ffc28980a8a0c72d556ba0d2290e2"
      - name: Generate pinned SQLite amalgamation
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          mkdir sqlite-build
          cd sqlite-build
          ../sqlite-source/configure
          make sqlite3.c -j2
          printf '%s  %s\n' \
            '4cee66a6b5eecaf9a016fd62bdc64be75a1f5ab1c34c5881a539fdca639fada6' \
            'sqlite3.c' | shasum -a 256 -c -
          printf '%s  %s\n' \
            'ab12aaa090d3921ba8fd2c8c198ae1e8cafce79fd9897a5b89830fab1f6ecef5' \
            'sqlite3.h' | shasum -a 256 -c -
      - name: Configure benchmark contracts
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          cmake --preset benchmark \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMODERN_SQLITE_PINNED_SQLITE_C="$GITHUB_WORKSPACE/sqlite-build/sqlite3.c" \
            -DMODERN_SQLITE_PINNED_SQLITE_H="$GITHUB_WORKSPACE/sqlite-build/sqlite3.h"
      - name: Build benchmark contracts
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/verify.py build-native
          --build-directory build/benchmark
          --parallel 3
      - name: Run benchmark smoke and fixture contracts
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          ctest --test-dir build/benchmark \
            --output-on-failure \
            -R '^(performance\.((read|index|write)_(benchmark_cli|fixture_regeneration)|write_benchmark_diagnostic_.*|order_by_(benchmark_cli|fixture_regeneration)|(distinct_compound|aggregate)_benchmark_cli|preparation_benchmark_contract)|compatibility\.(btree_writer_sqlite|rollback_journal_fixture_regeneration|transaction_sqlite|write_pager_sqlite|write_session_sqlite(_(page_case|crash_case|invalid_case))?))$'
      - name: Report compiler cache
        if: github.event_name == 'push' || matrix.run_on_pr
        run: ccache --show-stats
