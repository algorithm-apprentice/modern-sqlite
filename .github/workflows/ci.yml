name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Native Windows (MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select the native MSVC developer environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -version '[18.0,19.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) {
            throw "The native Visual Studio C++ toolchain is unavailable"
          }
          $env:PATH = "$(Split-Path $vswhere);$env:PATH"
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $variables = & $env:ComSpec /d /c "call `"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "Could not initialize the MSVC developer environment" }
          $selected = @(
            'PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir',
            'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion',
            'UniversalCRTSdkDir', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH',
            'VisualStudioVersion'
          )
          foreach ($variable in $variables) {
            $separator = $variable.IndexOf('=')
            if ($separator -gt 0 -and $selected -contains $variable.Substring(0, $separator)) {
              $variable | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sqlite/sqlite
          ref: cb547ab3e931c7766e24834af5ef6c4578863e3d
          path: sqlite-source
      - name: Record native toolchain and pinned source
        run: |
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw "The native MSVC target is not x64" }
          $compiler = (Get-Command cl.exe).Source
          (Get-Item $compiler).VersionInfo | Select-Object FileVersion, ProductVersion
          cmake --version
          ninja --version
          python --version
          if ((git -C sqlite-source rev-parse HEAD) -ne `
              'cb547ab3e931c7766e24834af5ef6c4578863e3d') { throw "Unexpected SQLite checkout" }
          if ((Get-Content sqlite-source\VERSION -Raw).Trim() -ne '3.54.0') {
            throw "Unexpected SQLite version"
          }
          if ((Get-Content sqlite-source\manifest.uuid -Raw).Trim() -ne `
              '65ec11f05a9ee5b23495427ece76c0550a8ffc28980a8a0c72d556ba0d2290e2') {
            throw "Unexpected SQLite manifest"
          }
      - name: Generate the pinned native oracle inputs
        run: |
          $source = (Resolve-Path sqlite-source).Path
          $build = (New-Item -ItemType Directory sqlite-build).FullName
          Push-Location $build
          try {
            nmake /nologo /f "$source\Makefile.msc" "TOP=$source" jimsh0.exe
            if ($LASTEXITCODE -ne 0) { throw "Could not build the native SQLite generator" }
            $jim = Join-Path $build 'jimsh0.exe'
            nmake /nologo /f "$source\Makefile.msc" "TOP=$source" "JIM_TCLSH=$jim" sqlite3.c
            if ($LASTEXITCODE -ne 0) { throw "Could not generate the pinned SQLite source" }
            $hostTools = (New-Item -ItemType Directory host-tools).FullName
            Copy-Item -LiteralPath .\src-verify.exe -Destination "$hostTools\src-verify.exe"
            if ((Get-FileHash .\src-verify.exe).Hash -ne `
                (Get-FileHash "$hostTools\src-verify.exe").Hash) {
              throw "Native source verifier staging changed its bytes"
            }
            $env:PATH = "$hostTools;$env:PATH"
            "set argv [list --linemacros=0]`nsource [file normalize {$source\tool\mksqlite3c.tcl}]" |
              & $jim
            if ($LASTEXITCODE -ne 0) { throw "Could not attest the pinned SQLite source" }
            $pins = @{
              'sqlite3.c' = '4cee66a6b5eecaf9a016fd62bdc64be75a1f5ab1c34c5881a539fdca639fada6'
              'sqlite3.h' = 'ab12aaa090d3921ba8fd2c8c198ae1e8cafce79fd9897a5b89830fab1f6ecef5'
            }
            foreach ($file in $pins.Keys) {
              if ((Get-FileHash -Algorithm SHA256 $file).Hash -ne $pins[$file]) {
                throw "Pinned SQLite source hash mismatch: $file"
              }
            }
          } finally {
            Pop-Location
          }
      - name: Configure native Windows
        run: |
          $python = (Get-Command python.exe).Source
          cmake --preset windows-debug `
            "-DPython3_EXECUTABLE=$python" `
            "-DMODERN_SQLITE_PINNED_SQLITE_C=$PWD\sqlite-build\sqlite3.c" `
            "-DMODERN_SQLITE_PINNED_SQLITE_H=$PWD\sqlite-build\sqlite3.h"
      - name: Build native owning contracts
        run: >-
          cmake --build --preset windows-debug --parallel 2 --target
          modern_sqlite_windows_vfs_tests modern_sqlite_windows_vfs_oom_test
      - name: Run native owning contracts
        run: >-
          ctest --test-dir build\windows-msvc-debug --output-on-failure --no-tests=error
          -R '^(WindowsProcess\.|WindowsVfs\.|platform\.windows_vfs_oom$)'
      - name: Build native Windows
        run: cmake --build --preset windows-debug --parallel 2
      - name: Measure native temporary storage controls
        run: >-
          python tools\native_temporary_storage_probe.py
          --system-root "$env:TEMP" --runner-root "$env:RUNNER_TEMP"
      - name: Run the complete declared native correctness tier
        id: native_correctness
        run: ctest --preset windows-debug
      - name: Publish native write-owner progress
        if: always()
        run: |
          Write-Output "TEMP=$env:TEMP"
          Write-Output "TMP=$env:TMP"
          Write-Output "RUNNER_TEMP=$env:RUNNER_TEMP"
          $log = 'build\windows-msvc-debug\Testing\Temporary\LastTest.log'
          $outcome = '${{ steps.native_correctness.outcome }}'
          if (Test-Path -LiteralPath $log) {
            $progress = @(Select-String -LiteralPath $log -Pattern '^write-(model|session)-')
            foreach ($owner in @('write-model-', 'write-session-')) {
              $captured = @($progress | Where-Object { $_.Line.StartsWith($owner) })
              if ($captured.Count -eq 0) {
                if ($outcome -eq 'success') {
                  throw "The successful native selection did not capture $owner progress"
                }
                Write-Warning "An earlier native failure prevented the $owner owner from running"
              }
            }
            $progress | ForEach-Object { Write-Output $_.Line }
          } else {
            if ($outcome -eq 'success') {
              throw 'The successful native selection did not produce its CTest log'
            }
            Write-Warning 'An earlier build or test failure prevented the native CTest log'
          }
      - name: Run native verification and workflow tooling
        run: >-
          ctest --test-dir build\windows-msvc-debug --output-on-failure --no-tests=error
          -R '^tools\.(verification|ci_workflow_policy)$'
      - name: Check the native Windows backend with clang-tidy
        run: |
          $clangTidy = Join-Path $env:VSINSTALLDIR 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'
          & $clangTidy --version
          if ($LASTEXITCODE -ne 0) { throw "The native Windows clang-tidy is unavailable" }
          cmake -S . -B build\windows-quality -G Ninja `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Debug `
            -DMODERN_SQLITE_BUILD_TESTS=OFF `
            -DMODERN_SQLITE_ENABLE_CLANG_TIDY=ON `
            "-DMODERN_SQLITE_CLANG_TIDY_EXECUTABLE=$clangTidy"
          if ($LASTEXITCODE -ne 0) { throw "Could not configure native Windows quality" }
          cmake --build build\windows-quality --parallel 2 --target `
            CMakeFiles/modern_sqlite.dir/src/platform/windows_vfs.cpp.obj

  build-and-test:
    name: build-and-test (${{ matrix.os }}, ${{ matrix.preset }})
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: dev-debug
            run_on_pr: false
          - os: ubuntu-latest
            preset: release
            run_on_pr: true
          - os: macos-latest
            preset: dev-debug
            run_on_pr: true
          - os: macos-latest
            preset: release
            run_on_pr: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || matrix.run_on_pr
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: github.event_name == 'push' || matrix.run_on_pr
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.preset }}-
      - name: Install Ninja on Linux
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ccache ninja-build
      - name: Install Ninja on macOS
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Configure
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          cmake --preset "${{ matrix.preset }}"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        if: github.event_name == 'push' || matrix.run_on_pr
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 3
      - name: Test
        if: github.event_name == 'push' || matrix.run_on_pr
        run: ctest --preset "${{ matrix.preset }}" --parallel 2
      - name: Report compiler cache
        if: github.event_name == 'push' || matrix.run_on_pr
        run: ccache --show-stats

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-asan-ubsan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: ccache-${{ runner.os }}-asan-ubsan-
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install --yes ccache ninja-build
      - name: Configure
        run: cmake --preset asan-ubsan -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset asan-ubsan --parallel 3
      - name: Test
        run: ctest --preset asan-ubsan --parallel 2
      - name: Report compiler cache
        run: ccache --show-stats

  quality:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install quality tools
        run: |
          brew install llvm ninja
          python3 -m venv .quality-tools
          .quality-tools/bin/pip install clang-format==23.1.2
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$PWD/.quality-tools/bin" >> "$GITHUB_PATH"
      - name: Check engineering discipline
        run: python3 tools/check_engineering_discipline.py
      - name: Configure quality build
        run: |
          cmake --preset clang-tidy \
            -DMODERN_SQLITE_CLANG_FORMAT_EXECUTABLE="$PWD/.quality-tools/bin/clang-format" \
            -DMODERN_SQLITE_CLANG_TIDY_EXECUTABLE="$(brew --prefix llvm)/bin/clang-tidy"
      - name: Check changed translation units
        if: github.event_name == 'pull_request'
        run: >
          python3 tools/run_changed_clang_tidy.py
          --base-ref "origin/${{ github.base_ref }}"
          --build-directory build/clang-tidy
          --jobs 3
          --smoke-source src/base/bytes.cpp
      - name: Check formatting
        run: cmake --build --preset clang-tidy --target check-format

  read-performance-contract:
    name: read-performance-contract (${{ matrix.os }})
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run_on_pr: true
          - os: macos-latest
            run_on_pr: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || matrix.run_on_pr
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: github.event_name == 'push' || matrix.run_on_pr
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: ccache-${{ runner.os }}-release-
      - name: Validate committed read baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          python3 tools/read_performance.py validate-historical-baseline \
            --repository-root . \
            --workloads tests/performance/read-workloads-v1.json \
            --baseline benchmarks/read-baseline-v1
      - name: Validate committed index workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/index_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/index-workloads-v1.json
      - name: Validate committed index baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          if test -d benchmarks/index-baseline-v1; then
            python3 tools/index_performance.py validate-historical-baseline \
              --repository-root . \
              --workloads tests/performance/index-workloads-v1.json \
              --baseline benchmarks/index-baseline-v1
          fi
      - name: Validate committed ORDER BY workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/order_by_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/order-by-workloads-v1.json
      - name: Validate committed ORDER BY baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          python3 tools/order_by_performance.py validate-historical-baseline \
            --repository-root . \
            --workloads tests/performance/order-by-workloads-v1.json \
            --baseline benchmarks/order-by-baseline-v1
      - name: Validate committed DISTINCT and compound workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/distinct_compound_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/distinct-compound-workloads-v1.json
      - name: Validate committed DISTINCT and compound baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/distinct_compound_performance.py validate-historical-baseline
          --repository-root .
          --workloads tests/performance/distinct-compound-workloads-v1.json
          --baseline benchmarks/distinct-compound-baseline-v1
      - name: Validate committed aggregate workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/aggregate_performance.py validate-workloads
          --repository-root .
          --workloads tests/performance/aggregate-workloads-v1.json
      - name: Validate committed aggregate baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/aggregate_performance.py validate-historical-baseline
          --repository-root .
          --workloads tests/performance/aggregate-workloads-v1.json
          --baseline benchmarks/aggregate-baseline-v1
      - name: Validate committed write workloads
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          python3 tools/write_performance.py validate-workloads \
            --workloads tests/performance/write-workloads-v1.json
          python3 tools/write_performance_v2.py validate-workloads \
            --workloads tests/performance/write-workloads-v2.json
      - name: Validate committed write baseline
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          if test -d benchmarks/write-baseline-v1; then
            python3 tools/write_performance_v2.py validate-historical-baseline \
              --repository-root . \
              --workloads tests/performance/write-workloads-v1.json \
              --baseline benchmarks/write-baseline-v1
          fi
          if test -d benchmarks/write-baseline-v2; then
            python3 tools/write_performance_v2.py validate-baseline \
              --repository-root . \
              --workloads tests/performance/write-workloads-v2.json \
              --baseline benchmarks/write-baseline-v2
          fi
      - name: Check out pinned SQLite
        if: github.event_name == 'push' || matrix.run_on_pr
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sqlite/sqlite
          ref: cb547ab3e931c7766e24834af5ef6c4578863e3d
          path: sqlite-source
      - name: Install benchmark tools on Linux
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ccache ninja-build tcl
      - name: Install benchmark tools on macOS
        if: >-
          (github.event_name == 'push' || matrix.run_on_pr) &&
          runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Verify pinned SQLite checkout
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          test "$(cat sqlite-source/VERSION)" = "3.54.0"
          test "$(cat sqlite-source/manifest.uuid)" = \
            "65ec11f05a9ee5b23495427ece76c0550a8ffc28980a8a0c72d556ba0d2290e2"
      - name: Generate pinned SQLite amalgamation
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          mkdir sqlite-build
          cd sqlite-build
          ../sqlite-source/configure
          make sqlite3.c -j2
          printf '%s  %s\n' \
            '4cee66a6b5eecaf9a016fd62bdc64be75a1f5ab1c34c5881a539fdca639fada6' \
            'sqlite3.c' | shasum -a 256 -c -
          printf '%s  %s\n' \
            'ab12aaa090d3921ba8fd2c8c198ae1e8cafce79fd9897a5b89830fab1f6ecef5' \
            'sqlite3.h' | shasum -a 256 -c -
      - name: Configure benchmark contracts
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          cmake --preset benchmark \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMODERN_SQLITE_PINNED_SQLITE_C="$GITHUB_WORKSPACE/sqlite-build/sqlite3.c" \
            -DMODERN_SQLITE_PINNED_SQLITE_H="$GITHUB_WORKSPACE/sqlite-build/sqlite3.h"
      - name: Build benchmark contracts
        if: github.event_name == 'push' || matrix.run_on_pr
        run: >
          python3 tools/verify.py build-native
          --build-directory build/benchmark
          --parallel 3
      - name: Run benchmark smoke and fixture contracts
        if: github.event_name == 'push' || matrix.run_on_pr
        run: |
          ctest --test-dir build/benchmark \
            --output-on-failure \
            -R '^(performance\.((read|index|write)_(benchmark_cli|fixture_regeneration)|write_benchmark_diagnostic_.*|order_by_(benchmark_cli|fixture_regeneration)|(distinct_compound|aggregate)_benchmark_cli|preparation_benchmark_contract)|compatibility\.(btree_writer_sqlite|rollback_journal_fixture_regeneration|transaction_sqlite|write_pager_sqlite|write_session_sqlite(_(page_case|crash_case|invalid_case))?))$'
      - name: Report compiler cache
        if: github.event_name == 'push' || matrix.run_on_pr
        run: ccache --show-stats
